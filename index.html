<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gas & Luce SRL — Retention Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0D1117; color: #C8D8E8; font-family: "DM Sans", sans-serif; }
    input::placeholder, textarea::placeholder { color: #444; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const GREEN = "#00C2A0";
const DARK = "#0D1117";
const PANEL = "#111820";
const MUTED = "#5A6A7A";
const LIGHT = "#C8D8E8";
const BORDER = "rgba(0,194,160,0.15)";
const API_KEY = "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";

const situazioni = [
  "Cliente vuole andarsene (switch imminente)",
  "Cliente insoddisfatto del prezzo",
  "Concorrente ha fatto un offerta",
  "Cliente non risponde / freddo",
  "Cliente arrabbiato per una bolletta",
  "Cliente che minaccia di fare reclamo",
  "Rinnovo contratto in scadenza"
];

const concorrenti = ["Enel Energia","Eni gas e luce","Edison","A2A","Iberdrola","Illumia","Sorgenia","Plenitude","Altro"];

function App() {
  const [step, setStep] = useState("form");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState("");
  const [nome, setNome] = useState("");
  const [situazione, setSituazione] = useState("");
  const [dettaglio, setDettaglio] = useState("");
  const [concorrente, setConcorrente] = useState("");
  const [anni, setAnni] = useState("");

  const generate = async () => {
    if (!situazione) { alert("Seleziona la situazione."); return; }
    setLoading(true);
    setStep("result");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": API_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-3-5-sonnet-20241022",
          max_tokens: 2000,
          system: "Sei un esperto di retention clienti per il settore energia. Supporti gli sportellisti di Gas & Luce SRL. Output pratico, pronto all uso in 30 secondi. Scrivi in italiano. Struttura con: APERTURA CONSIGLIATA, TECNICA CHIAVE, SCRIPT PRINCIPALE (battute numerate), DOMANDE DI ANCORAGGIO, GESTIONE OBIEZIONE PREZZO, SEGNALE DI CHIUSURA. Usa sempre il nome reale del cliente, mai placeholder.",
          messages: [{
            role: "user",
            content: "Nome cliente: " + (nome || "il cliente") + "\nSituazione: " + situazione + "\nDettagli: " + (dettaglio || "nessuno") + "\nConcorrente: " + (concorrente || "non specificato") + "\nAnni come cliente: " + (anni || "non specificati") + "\n\nGenera script di retention."
          }]
        })
      });
      const data = await res.json();
      if (data.error) setResult("Errore API: " + data.error.type + " — " + data.error.message);
      else if (data.content && data.content[0]) setResult(data.content[0].text);
      else setResult("Risposta vuota: " + JSON.stringify(data));
    } catch(e) {
      setResult("Errore connessione: " + e.message);
    }
    setLoading(false);
  };

  const s = {
    app: { minHeight: "100vh", background: DARK },
    header: { background: PANEL, borderBottom: "1px solid " + BORDER, padding: "16px 28px", display: "flex", alignItems: "center", gap: 12 },
    dot: { width: 8, height: 8, borderRadius: "50%", background: GREEN },
    title: { fontSize: 13, fontWeight: 700, color: LIGHT },
    sub: { fontSize: 10, color: MUTED },
    container: { maxWidth: 680, margin: "0 auto", padding: "32px 20px" },
    card: { background: PANEL, border: "1px solid " + BORDER, padding: "20px", marginBottom: 14, borderRadius: 8 },
    label: { fontSize: 10, letterSpacing: "0.2em", color: GREEN, textTransform: "uppercase", fontWeight: 700, marginBottom: 6, display: "block" },
    input: { width: "100%", background: DARK, border: "1px solid rgba(0,194,160,0.2)", color: LIGHT, padding: "10px 12px", fontSize: 14, borderRadius: 5, outline: "none", fontFamily: "inherit", boxSizing: "border-box" },
    select: { width: "100%", background: DARK, border: "1px solid rgba(0,194,160,0.2)", color: LIGHT, padding: "10px 12px", fontSize: 14, borderRadius: 5, outline: "none", cursor: "pointer", boxSizing: "border-box" },
    textarea: { width: "100%", background: DARK, border: "1px solid rgba(0,194,160,0.2)", color: LIGHT, padding: "10px 12px", fontSize: 14, borderRadius: 5, outline: "none", fontFamily: "inherit", resize: "vertical", minHeight: 80, boxSizing: "border-box" },
    row: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 },
    cta: { width: "100%", padding: "14px", background: GREEN, color: DARK, fontSize: 11, letterSpacing: "0.2em", textTransform: "uppercase", border: "none", cursor: "pointer", fontFamily: "inherit", fontWeight: 700, borderRadius: 5 },
    back: { background: "none", border: "1px solid " + BORDER, color: MUTED, padding: "8px 16px", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", cursor: "pointer", fontFamily: "inherit", borderRadius: 5, marginBottom: 20 },
    resultBox: { background: PANEL, border: "1px solid " + BORDER, padding: "24px", borderRadius: 8 }
  };

  const formatResult = (text) => {
    return text.split("\n").map((line, i) => {
      if (!line.trim()) return React.createElement("div", {key:i, style:{height:8}});
      const headers = ["APERTURA CONSIGLIATA","TECNICA CHIAVE","SCRIPT PRINCIPALE","DOMANDE DI ANCORAGGIO","GESTIONE OBIEZIONE PREZZO","SEGNALE DI CHIUSURA"];
      const clean = line.replace(/\*\*(.*?)\*\*/g,"$1").replace(/\*(.*?)\*/g,"$1");
      if (headers.some(h => clean.toUpperCase().includes(h))) {
        return React.createElement("p", {key:i, style:{color:GREEN, fontSize:10, letterSpacing:"0.2em", textTransform:"uppercase", fontWeight:700, marginTop:18, marginBottom:6}}, clean);
      }
      if (line.startsWith("AGENTE:")) {
        return React.createElement("div", {key:i, style:{background:"rgba(0,194,160,0.06)", border:"1px solid rgba(0,194,160,0.2)", borderRadius:5, padding:"8px 12px", marginBottom:6}},
          React.createElement("span", {style:{color:GREEN, fontSize:10, fontWeight:700, display:"block", marginBottom:3}}, "AGENTE"),
          React.createElement("p", {style:{color:LIGHT, fontSize:14, lineHeight:1.6}}, line.replace("AGENTE:","").trim())
        );
      }
      if (line.startsWith("CLIENTE")) {
        return React.createElement("div", {key:i, style:{background:"rgba(61,158,255,0.06)", border:"1px solid rgba(61,158,255,0.2)", borderRadius:5, padding:"8px 12px", marginBottom:6, marginLeft:16}},
          React.createElement("span", {style:{color:"#3D9EFF", fontSize:10, fontWeight:700, display:"block", marginBottom:3}}, "CLIENTE"),
          React.createElement("p", {style:{color:"#B0C4DC", fontSize:14, lineHeight:1.6}}, line.replace(/CLIENTE.*?:/,"").trim())
        );
      }
      return React.createElement("p", {key:i, style:{color:"#A8BCCC", fontSize:14, lineHeight:1.7, marginBottom:3}}, clean);
    });
  };

  if (step === "result") return (
    <div style={s.app}>
      <div style={s.header}>
        <div style={s.dot} />
        <div><div style={s.title}>Gas & Luce SRL</div><div style={s.sub}>Retention Assistant</div></div>
      </div>
      <div style={s.container}>
        <button style={s.back} onClick={()=>{setStep("form");setResult("");}}>← Nuova situazione</button>
        {loading ? (
          <div style={{textAlign:"center", padding:"60px 0"}}>
            <p style={{color:GREEN, fontSize:11, letterSpacing:"0.2em", textTransform:"uppercase"}}>Elaborazione script...</p>
          </div>
        ) : (
          <div style={s.resultBox}>
            <p style={{color:GREEN, fontSize:10, letterSpacing:"0.2em", textTransform:"uppercase", marginBottom:16, paddingBottom:12, borderBottom:"1px solid "+BORDER}}>Script pronto — {situazione}</p>
            {formatResult(result)}
            <button style={{...s.back, marginBottom:0, marginTop:20}} onClick={()=>navigator.clipboard.writeText(result)}>Copia script</button>
          </div>
        )}
      </div>
    </div>
  );

  return (
    <div style={s.app}>
      <div style={s.header}>
        <div style={s.dot} />
        <div><div style={s.title}>Gas & Luce SRL</div><div style={s.sub}>Retention Assistant — AI</div></div>
      </div>
      <div style={s.container}>
        <h1 style={{fontSize:22, fontWeight:700, color:"#fff", marginBottom:6}}>Gestisci il cliente</h1>
        <p style={{fontSize:13, color:MUTED, marginBottom:24}}>Descrivi la situazione — ti genero uno script NLP pronto all uso.</p>

        <div style={s.card}>
          <div style={{marginBottom:14}}>
            <label style={s.label}>Nome cliente</label>
            <input style={s.input} value={nome} onChange={e=>setNome(e.target.value)} placeholder="Es. Mario Rossi" />
          </div>
          <div>
            <label style={s.label}>Situazione *</label>
            <select style={s.select} value={situazione} onChange={e=>setSituazione(e.target.value)}>
              <option value="">Seleziona...</option>
              {situazioni.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        </div>

        <div style={s.card}>
          <div style={s.row}>
            <div>
              <label style={s.label}>Anni come cliente</label>
              <input style={s.input} type="number" value={anni} onChange={e=>setAnni(e.target.value)} placeholder="Es. 3" />
            </div>
            <div>
              <label style={s.label}>Concorrente citato</label>
              <select style={s.select} value={concorrente} onChange={e=>setConcorrente(e.target.value)}>
                <option value="">Nessuno</option>
                {concorrenti.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>
        </div>

        <div style={s.card}>
          <label style={s.label}>Dettagli aggiuntivi</label>
          <textarea style={s.textarea} value={dettaglio} onChange={e=>setDettaglio(e.target.value)} placeholder="Es. offerta concorrente a 0,30 euro/kwh, cliente da 4 anni, bolletta più alta del solito..." />
        </div>

        <button style={s.cta} onClick={generate}>Genera script di retention →</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
